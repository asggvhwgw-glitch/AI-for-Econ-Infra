name: Tests and release validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '4'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]" build
      - run: python scripts/version.py gate
      - run: python scripts/run_tests.py -- -q --junitxml=test-results.xml
      - run: python -m build --outdir dist
      - run: python scripts/verify_clean_install.py --dist dist
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results.xml
            dist/*
          if-no-files-found: warn
  bundle:
    needs: test
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[test]" build
      - run: bash scripts/build_release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: dist/*
# This workflow validates and uploads CI artifacts; it never publishes a tag,
# a GitHub Release, or a package to PyPI.
